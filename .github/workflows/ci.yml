name: PrayerTime checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: npm --prefix apps/web ci
      - run: cargo build --locked -p prayertime-cli
      - run: ./scripts/build-wasm.sh
      - run: node scripts/test-wasm.mjs
      - run: node scripts/test-view-model.mjs
      - run: node scripts/prepare-timezone.mjs
      - run: node scripts/test-location.mjs
      - run: node scripts/test-explanations.mjs
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web run build
      - run: node scripts/test-offline.mjs
